{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-1">Organization Settings</h1>
<p class="text-slate-500 text-sm mb-6">{{ PLAN_LIMITS[org.plan].label }} plan · Manage your company profile.</p>

<div class="flex gap-2 mb-6 text-sm">
  <a href="/settings" class="px-3 py-1.5 rounded-lg bg-brand-50 text-brand-700 font-medium">Organization</a>
  <a href="/settings/users" class="px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100">Users</a>
  <a href="/settings/rules" class="px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100">Validation Rules</a>
</div>

<form method="post" action="/settings" class="bg-white rounded-xl border border-slate-200 p-6 max-w-xl space-y-4">
  <div>
    <label class="text-sm font-medium text-slate-700">Company name</label>
    <input name="name" required value="{{ org.name }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
  </div>
  <div>
    <label class="text-sm font-medium text-slate-700">Billing/contact email</label>
    <input name="email" type="email" required value="{{ org.email }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
  </div>
  <div class="text-xs text-slate-400">Plan: <strong>{{ PLAN_LIMITS[org.plan].label }}</strong> · <a href="/billing" class="text-brand-600">Manage billing →</a></div>
  <button class="bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg px-5 py-2.5 text-sm">Save changes</button>
</form>
{% endblock %}
