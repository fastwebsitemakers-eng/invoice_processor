{% extends "base.html" %}
{% block full %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 font-bold text-xl text-brand-700">
        {% if site.logo_url %}<img src="{{ site.logo_url }}" alt="{{ site.product_name }}" class="h-8 max-w-[180px] object-contain">
        {% else %}{{ site.product_name }}{% endif %}
      </a>
    </div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      {% if error %}<div class="mb-4 text-sm text-rose-700 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="text-sm font-medium text-slate-700">Email</label>
          <input name="email" type="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700">Password</label>
          <input name="password" type="password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg py-2.5 text-sm">Log in</button>
      </form>
      <div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-400">
        Demo login: <span class="font-mono">admin@example.com</span> / <span class="font-mono">ChangeMe123!</span>
      </div>
    </div>
    <p class="text-center text-sm text-slate-500 mt-6">New here? <a href="/register" class="text-brand-600 font-medium">Start free</a></p>
  </div>
</div>
{% endblock %}
